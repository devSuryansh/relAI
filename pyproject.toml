[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relai"
version = "0.1.0"
description = "Agent Reliability Lab: evaluation, failure analysis, and optimization for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Suryansh Singh" },
    { name = "Simran Kumari" },
    { name = "Tanishka Sahu" },
]
keywords = [
    "agents",
    "evaluation",
    "reliability",
    "llm",
    "failure-analysis",
    "fault-injection",
    "benchmark",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
relai = "relai.cli:main"

[project.urls]
Homepage = "https://github.com/devSuryansh/relAI"
Issues = "https://github.com/devSuryansh/relAI/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
relai = ["py.typed", "suites/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
